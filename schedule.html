<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - LiveMyGospel</title>
    
    <!-- Import bootstrap framework -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    >

    <link rel="stylesheet" href="main.css">
</head>

<body>
    <header class="bg-dark text-white p-4">
        <h1>
            <img src="images/LiveMyGospelLogoNew.png" alt="LiveMyGospel logo" width="100">LiveMyGospel
        </h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="schedule.html">Schedule</a>
        <a href="planning.html">Planning</a>
        <a href="login.html">Login</a>
    </nav>

    <main class="container mt-4">
        <h2>Schedule</h2>

        <section class="p-4 mb-2">
            <p>Next Day  /  Today  / Previous Day</p>
            <button>←</button>
            <button>→</button>
        </section>
        <section class="p-4 mb-2">
            <h2>Today's Schedule</h2>
            <h3>September 22, 2026</h3>
            <!-- Schedule events will eventually be loaded from the database for the current user. -->

            <article class="p-4">
                <h3>Morning Routine</h3>
                <time>8:00 AM</time>
                <p>30 minutes</p>
            </article>

            <article class="p-4">
                <h3>Work</h3>
                <time>9:00 AM</time>
                <p>3 hours</p>
            </article>

            <!-- more events -->
             <button>Add Event</button>
        </section>
    </main>

    <footer>
        <p>LiveMyGospel by Taylor Richins</p>
        <p><a href="https://github.com/if-taylor/startup">GitHub Repository</a></p>
    </footer>
</body>
</html>
