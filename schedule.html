<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - LiveMyGospel</title>
    
    <!-- Import bootstrap framework -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    >

    <link rel="stylesheet" href="main.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="nav-brand">
                <img src="images/LiveMyGospelLogoNew.png" alt="LiveMyGospel Logo">
                <span>LiveMyGospel</span>
            </a>

            <div class="nav-links">
                <a href="schedule.html">SCHEDULE</a>
                <a href="planning.html">PLANNING</a>
                <a href="login.html">LOGIN</a>
            </div>
        </nav>
    </header>

    <main class="container mt-4">
        <h2>Schedule</h2>

        <section class="schedule-navigation">
            <div class="date-navigation">
                <button>← Previous Day</button>
                <button>Today</button>
                <button>Next Day →</button>
            </div>
        </section>

        <section class="schedule">
            <h2>Today's Schedule</h2>
            <h3>September 22, 2026</h3>
            <!-- Schedule events will eventually be loaded from the database for the current user. -->
            <section class="schedule-timeline">
                <article class="schedule-event">
                    <time>8:00 AM</time>
                    <div>
                        <h3>Morning Routine</h3>
                    </div>                
                </article>

                <article class="schedule-event">
                    <time>9:00 AM</time>
                    <div>
                        <h3>Work</h3>
                    </div>   
                </article>
            </section>

            <!-- more events -->
             <button>Add Event</button>
        </section>
    </main>

    <footer>
        <p>LiveMyGospel by Taylor Richins</p>
        <p><a href="https://github.com/if-taylor/startup">GitHub Repository</a></p>
    </footer>
</body>
</html>
