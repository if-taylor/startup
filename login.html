<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LiveMyGospel</title>

    <!-- Import bootstrap framework -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    >

    <link rel="stylesheet" href="main.css">

    <link rel="icon" href="images/LiveMyGospelLogoNew.png">

    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="nav-brand">
                <img src="images/LiveMyGospelLogoNew.png" alt="LiveMyGospel Logo">
                <span>LiveMyGospel</span>
            </a>

            <div class="nav-links">
                <a href="schedule.html">SCHEDULE</a>
                <a href="planning.html">PLANNING</a>
                <a href="login.html">LOGIN</a>
            </div>
        </nav>
    </header>

    <main class="container mt-4">

        <section class="login-section">
            <h2>Sign In</h2>
            <form>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <label for="password">Password:</label>
                <input type="password" id="password" name="password">

                <button type="submit">Login</button>
            </form>
            <p>Don't have an account?<a href="#">Create an account</a></p>

        </section>
        <!-- Placeholder for displaying the logged-in user's name -->
        <h2 class="display-6 text-center">Welcome, user!</h2>
    </main>

    <footer>
        <p>LiveMyGospel by Taylor Richins</p>
        <p><a href="https://github.com/if-taylor/startup">GitHub Repository</a></p>
    </footer>
</body>
</html>
