<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LiveMyGospel</title>

    <!-- Import bootstrap framework -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    >

    <link rel="stylesheet" href="main.css">
</head>

<body>
    <header class="bg-dark text-white p-4">
        <h1>
            <img src="images/LiveMyGospelLogo.png" alt="LiveMyGospel logo" width="100">LiveMyGospel
        </h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="schedule.html">Schedule</a>
        <a href="planning.html">Planning</a>
        <a href="login.html">Login</a>
    </nav>

    <main class="container mt-4">
        <h2>Login</h2>

        <section class="p-4 mb-2">
            <h3>Sign In</h3>
            <form>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <label for="password">Password:</label>
                <input type="password" id="password" name="password">

                <button type="submit">Login</button>
            </form>
            <p>Don't have an account? <a href="#">Create an account</a></p>

        </section>
        <!-- Placeholder for displaying the logged-in user's name -->
        <h3>Welcome, user!</h3>
    </main>

    <footer>
        <p>LiveMyGospel by Taylor Richins</p>
        <p><a href="https://github.com/if-taylor/startup">GitHub Repository</a></p>
    </footer>
</body>
</html>
