<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning - LiveMyGospel</title>

    <!-- Import bootstrap framework -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    >

    <link rel="stylesheet" href="main.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="nav-brand">
                <img src="images/LiveMyGospelLogoNew.png" alt="LiveMyGospel Logo">
                <span>LiveMyGospel</span>
            </a>

            <div class="nav-links">
                <a href="schedule.html">SCHEDULE</a>
                <a href="planning.html">PLANNING</a>
                <a href="login.html">LOGIN</a>
            </div>
        </nav>
    </header>

    <main class="container mt-4">
        <!-- User goals and habits will eventually be loaded from a database. -->
        <section class="planning">
            <section class="planning-section">
                <h3>Habits</h3>
            
                <ul>
                    <li>
                        <button class="habit-item">
                            <div class="item-header">
                                <h3>Exercise</h3>
                                <span>Every weekday</span>
                            </div>
                        </button>
                    </li>

                    <li>
                        <button class="habit-item">
                            <div class="item-header">
                                <h3>Read Scriptures</h3>
                                <span>Every day</span>
                            </div>
                        </button>
                    </li>

                    <li>
                        <button class="habit-item">
                            <div class="item-header">
                                <h3>Build my Website</h3>
                                <span>3 times per week</span>
                            </div>
                        </button>
                    </li>
                </ul>
                <button>New Habit</button>
            </section>

            <section class="planning-section">
                <h3>Goals</h3>
                <p>It is recommended to have at most 2-3 current goals</p>
                <ul>
                    <li>
                        <button class="goal-item">
                            <div class="item-header">
                                <h3>Read Old Testament</h3>
                                <span>October 25th</span>
                            </div>

                            <p>Progress: 60%</p>

                            <div class="progress-bar">
                                <div class="progress"></div>
                            </div>
                        </button>
                    </li>

                    <li>
                        <button class="goal-item">
                            <div class="item-header">
                                <h3>Build my Website</h3>
                                <span>December 1st</span>
                            </div>

                            <p>Progress: 25%</p>

                            <div class="progress-bar">
                                <div class="progress"></div>
                            </div>
                        </button>
                    </li>
                </ul>
                <button>New Goal</button>
            </section>

            <section class="planning-section">
                <h3>Past Goals</h3>
                <p>Here are the goals you've completed!</p>
                <ul>
                    <li>
                        <button class="goal-item">
                            <div class="item-header">
                                <h3>Read Book of Mormon</h3>
                                <span>Finished: July 12th</span>
                            </div>

                            <p>Progress: 100%</p>

                            <div class="progress-bar">
                                <div class="progress"></div>
                            </div>
                        </button>
                    </li>

                    <li>
                        <button class="goal-item">
                            <div class="item-header">
                                <h3>Learn Piano Piece</h3>
                                <span>Finished: May 5th</span>
                            </div>

                            <p>Progress: 100%</p>

                            <div class="progress-bar">
                                <div class="progress"></div>
                            </div>
                        </button>
                    </li>

                    <li>
                        <button class="goal-item">
                            <div class="item-header">
                                <h3>Run a Marathon</h3>
                                <span>Finished: November 19th, 2025</span>
                            </div>

                            <p>Progress: 100%</p>

                            <div class="progress-bar">
                                <div class="progress"></div>
                            </div>
                        </button>
                    </li>
                </ul>
            </section>
        </section>
    </main>

    <footer>
        <p>LiveMyGospel by Taylor Richins</p>
        <p><a href="https://github.com/if-taylor/startup">GitHub Repository</a></p>
    </footer>
</body>
</html>
